name: Weekly malware audit

# Audits redn3/blue-compressor from the outside for malware and tampering. Upstream code
# and release files are read as data: nothing from upstream is built, run or installed,
# and nothing is written to upstream. Results are committed here; a RED or YELLOW verdict
# opens or updates an issue in this repo so the owner gets a notification.
on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release to check (e.g. v0.3.6). Empty = latest release."
        required: false
        default: ""
      accept_baseline:
        description: "After a person reviewed the yellow lines: make this run's inventories the new baseline."
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  group: audit
  cancel-in-progress: false

env:
  TARGET_REPO: redn3/blue-compressor
  AUDIT_PLATFORM: macOS_arm64
  CARGO_AUDIT_VERSION: 0.22.2

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45 # VirusTotal scans of new uploads can take up to 15 minutes
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.report.outputs.verdict }}
      report: ${{ steps.report.outputs.report }}
    steps:
      - name: Check out this repo (scripts and baseline)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Clone the target with history and tags
        run: |
          set -euo pipefail
          git clone --no-tags "https://github.com/${TARGET_REPO}.git" target
          git -C target fetch --quiet --tags
          mkdir -p out

      - name: Install minisign and ClamAV
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true

      - name: Install cargo-audit (pinned)
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit@${{ env.CARGO_AUDIT_VERSION }}

      - name: Source, release, signature, ffmpeg and binary checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 -I scripts/audit.py --target target --repo-root . --out out --release-tag "$RELEASE_TAG"

      - name: cargo audit (RustSec, includes malicious-crate advisories)
        run: |
          set +e
          cargo audit --file target/Cargo.lock --json > out/audit.json 2> out/audit.stderr
          echo $? > out/audit.exit
          echo "exit $(cat out/audit.exit)"
          tail -n 5 out/audit.stderr

      - name: ClamAV scan of the downloaded release files
        run: |
          set +e
          sudo freshclam --stdout > out/freshclam.log 2>&1
          tail -n 5 out/freshclam.log
          clamscan --recursive --infected --max-filesize=600M --max-scansize=2000M \
            --max-files=50000 --max-recursion=20 out/dl > out/clamscan.log 2>&1
          echo $? > out/clamscan.exit
          cat out/clamscan.log
          python3 -I scripts/clamav_json.py out

      - name: Write the report
        id: report
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ACCEPT: ${{ inputs.accept_baseline }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          set -euo pipefail
          python3 -I scripts/audit.py --target target --repo-root . --out out --stage report > /dev/null
          day="$(date -u +%F)"
          name="$day"; [ -n "$RELEASE_TAG" ] && name="$day-$RELEASE_TAG"
          mkdir -p publish/reports publish/findings publish/manifests publish/state
          cp out/report.md "publish/reports/$name.md"
          cp out/findings.json "publish/findings/$name.json"
          cp out/manifests/*.txt publish/manifests/ 2>/dev/null || true
          if [ -z "$RELEASE_TAG" ]; then
            cp out/state.json publish/state/last.json
            cp README.md publish/README.md
            python3 -I scripts/readme_status.py out/findings.json "reports/$name.md" publish > /dev/null
          fi
          if [ ! -d baseline ] || [ "$ACCEPT" = "true" ]; then
            mkdir -p publish/baseline
            cp out/inventory/*.txt publish/baseline/
            echo "baseline=written" >> "$GITHUB_OUTPUT"
          fi
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"
          echo "verdict=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["verdict"])' out/findings.json)" >> "$GITHUB_OUTPUT"
          echo "report=reports/$name.md" >> "$GITHUB_OUTPUT"

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-${{ github.run_id }}
          path: |
            publish/
            out/*.json
            out/*.log
            out/inventory/
          if-no-files-found: error
          retention-days: 30

  commit:
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: audit-${{ github.run_id }}
          path: ${{ runner.temp }}/audit

      - name: Commit the report
        env:
          VERDICT: ${{ needs.scan.outputs.verdict }}
          REPORT: ${{ needs.scan.outputs.report }}
        run: |
          set -euo pipefail
          cp -R "$RUNNER_TEMP/audit/publish/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports findings manifests state README.md
          [ -d baseline ] && git add baseline
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -q -m "audit: $(basename "$REPORT" .md) $VERDICT"
          git push origin HEAD:main

      - name: Notify through an issue when a person must look
        if: needs.scan.outputs.verdict != 'GREEN'
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ needs.scan.outputs.verdict }}
          REPORT: ${{ needs.scan.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$(printf '**%s** in %s\n\nRun: %s\n\n' "$VERDICT" "$REPORT" "$RUN_URL"; sed -n '1,80p' "$REPORT")"
          num="$(gh issue list --state open --search 'in:title "Blue Compressor audit needs review"' --json number --jq '.[0].number // empty')"
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "Blue Compressor audit needs review ($VERDICT)" --body "$body"
          fi
